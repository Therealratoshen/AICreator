# CI - the guards, on every push
#
# This file is the workflow that runs on every push: every guard file, both
# demos, and a secret scan that fails the build.
#
# A copy also lives at `ci/guards.yml`, which explains the setup. That note is
# kept here as a comment so this file stays pure YAML - GitHub's parser reads
# the whole file, and prose above `name:` is not YAML.
name: guards

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The guards run on Node's own type-stripping loader: no build step,
      # no dependencies to install, nothing to go stale.
      - name: the guards
        run: node --experimental-strip-types --no-warnings scripts/run-all.ts

      # THE NO-FAKES GATE: this repo's central promise is that no number is
      # published without a row behind it. The guard proves it on every push.
      - name: the core loop still runs
        run: node --experimental-strip-types --no-warnings scripts/demo.ts

      # The three-agent flow is the thing a reader tries second, so a push that
      # breaks it should fail here rather than in someone's terminal.
      - name: the three-agent flow still runs
        run: node --experimental-strip-types --no-warnings scripts/demo-agents.ts

      # The secret scan. A public repo must not grow a secret.
      - name: no secrets
        run: |
          if grep -rInE 'sk_live_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY----' \
             --exclude-dir=.git . ; then
            echo "::error::a secret-shaped string was found"
            exit 1
          fi
          echo "no secret-shaped strings"
